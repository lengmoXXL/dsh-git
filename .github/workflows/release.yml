# Cut a release from a tag.
#
# The tag is the version, and the release carries the built package: `lib/` is the artifact
# the shell loads, so a release tarball needs no compiling on the machine that installs it —
# and, having no install scripts, nothing for pnpm to allow either. The pipeline refuses a
# tag that disagrees with `package.json`, so the version a release claims is the one it ships.
#
# An annotated tag's message is the release note: its subject is the title and its body the
# notes, so the release page says what the tag says. Write it the way this repository writes
# its commits — what changed, and why it matters — and leave the install lines to the run.
#
# Installing one is the ordinary plugin command, given the tarball's address: it forwards to
# pnpm in the profile, which unpacks a tarball as it is.
#
#   dsh plugin --profile web add <the tarball>

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the release note is the annotated tag's own message, and the
          # comparison link comes from describing the tag before this one. A default checkout
          # fetches a single commit, and neither is then there — the note silently falls back to
          # the commit that bumped the version, which is how 0.2.1 was first published.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refuse a tag the package does not agree with
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Pack the built package
        run: |
          version="$(node -p "require('./package.json').version")"
          npm pack
          cp "dsh-git-${version}.tgz" dsh-git.tgz
          ls -l ./*.tgz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME}"
          notes="$(git tag -l --format='%(contents:body)' "$tag")
          Install the tarball from this release:

              dsh plugin --profile web add https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/dsh-git-${version}.tgz

          The stable address, which always serves the newest release:

              dsh plugin --profile web add https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/dsh-git.tgz"
          previous="$(git describe --tags --abbrev=0 --match 'v*' "${tag}^" 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            notes="${notes}

          **Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${tag}"
          fi
          gh release create "$tag" --title "$(git tag -l --format='%(contents:subject)' "$tag")" --notes "$notes" || true
          gh release upload "$tag" "dsh-git-${version}.tgz" dsh-git.tgz --clobber
