<style>

  /* The shell's own tokens, with the values its theme package gives them.
     Inside the harness the shell defines these on `body`, which is nearer than

  :root {

      'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;

    --dsw-font-markdown-code-block: 11px/19px var(--ds-font-family-code);
    --dsw-font-xs-13: 13px/20px var(--dsw-font-family);
    --dsw-font-xxxs-11: 11px/14px var(--dsw-font-family);
    --dsw-alias-bg-base: rgb(255, 255, 255);
    --dsw-alias-markdown-code-block: rgb(249, 250, 251);
    --dsw-alias-markdown-code-block-banner: rgb(249, 250, 251);
    --dsw-alias-border-l1: rgba(0, 0, 0, 0.04);
    --dsw-alias-border-l2: rgba(0, 0, 0, 0.1);
    --dsw-alias-label-primary: rgb(15, 17, 21);
    --dsw-alias-label-secondary: rgb(97, 102, 107);
    --dsw-alias-label-tertiary: rgb(129, 133, 140);
    --dsw-alias-state-error-primary: rgb(236, 19, 19);
    --dsw-alias-state-error-secondary: rgb(242, 90, 90);
    --dsw-alias-state-success-primary: rgb(34, 197, 94);
    --dsw-alias-state-success-secondary: rgb(78, 209, 126);
    --dsw-alias-state-warn-label: rgb(221, 134, 41);
    --dsw-alias-state-business-primary: rgb(65, 118, 230);
    --dsw-alias-brand-primary: rgb(15, 17, 21);
    --dsw-alias-interactive-bg-hover: rgba(38, 49, 72, 0.06);
    --dsw-alias-interactive-bg-active: rgba(38, 49, 72, 0.1);
    --shiki-token-comment: #868e96;
    --shiki-token-keyword: #d6336c;
    --shiki-token-string: #2f9e44;
    --shiki-token-constant: #1c7ed6;
    --shiki-token-function: #6741d9;
    --shiki-token-parameter: #e8590c;
  }

  /* Opened on its own there is no shell to ask, so the system decides. */
  @media (prefers-color-scheme: dark) {
    :root {
      --dsw-alias-bg-base: rgb(21, 21, 23);
      --dsw-alias-markdown-code-block: rgb(27, 27, 28);
      --dsw-alias-markdown-code-block-banner: rgb(44, 44, 46);
      --dsw-alias-border-l1: rgba(255, 255, 255, 0.06);
      --dsw-alias-border-l2: rgba(255, 255, 255, 0.12);
      --dsw-alias-label-primary: rgb(249, 250, 251);
      --dsw-alias-label-secondary: rgb(207, 211, 214);
      --dsw-alias-label-tertiary: rgb(173, 178, 184);
      --dsw-alias-state-error-primary: rgb(242, 90, 90);
      --dsw-alias-state-error-secondary: rgb(242, 90, 90);
      --dsw-alias-state-success-primary: rgb(34, 197, 94);
      --dsw-alias-state-success-secondary: rgb(78, 209, 126);
      --dsw-alias-state-warn-label: rgb(221, 134, 41);
      --dsw-alias-state-business-primary: rgb(103, 158, 254);
      --dsw-alias-brand-primary: rgb(249, 250, 251);
      --dsw-alias-interactive-bg-hover: rgba(255, 255, 255, 0.08);
      --dsw-alias-interactive-bg-active: rgba(255, 255, 255, 0.14);
      --shiki-token-comment: #adb5bd;
      --shiki-token-keyword: #faa2c1;
      --shiki-token-string: #69db7c;
      --shiki-token-constant: #4dabf7;
      --shiki-token-function: #b197fc;
      --shiki-token-parameter: #ffa94d;
    }
  }

  /* What this panel calls its parts, in the shell's vocabulary. */
  :root {
    --bg: var(--dsw-alias-bg-base);
    --surface: var(--dsw-alias-markdown-code-block);
    --banner: var(--dsw-alias-markdown-code-block-banner);
    --line: var(--dsw-alias-border-l2);
    --line-soft: var(--dsw-alias-border-l1);
    --text: var(--dsw-alias-label-primary);
    --text-dim: var(--dsw-alias-label-secondary);
    --text-faint: var(--dsw-alias-label-tertiary);
    --accent: var(--dsw-alias-state-business-primary);
    --accent-soft: var(--dsw-alias-interactive-bg-active);
    --hover: var(--dsw-alias-interactive-bg-hover);
    --focus: var(--dsw-alias-brand-primary);
    --add: color-mix(in srgb, var(--dsw-alias-state-success-primary) 13%, var(--dsw-alias-markdown-code-block));
    --del: color-mix(in srgb, var(--dsw-alias-state-error-primary) 13%, var(--dsw-alias-markdown-code-block));
    --blank: color-mix(in srgb, var(--dsw-alias-bg-base) 45%, var(--dsw-alias-markdown-code-block));
    --row: 22px;
    --gutter: 48px;
    --radius: 12px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font: var(--dsw-font-xs-13);
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
  input { font: inherit; color: inherit; }

  /* ── header ─────────────────────────────────────────────────────────── */
  .top {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--banner);
  }
  .repo { font-weight: 600; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 1px 7px; border-radius: 999px; font-size: 11px;
    color: var(--text-dim); border: 1px solid var(--line); background: var(--surface);
  }
  .chip.head { color: #fff; background: var(--accent); border-color: transparent; }
  .spacer { flex: 1; }
  .toggle {
    display: inline-flex; padding: 1px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--surface);
  }
  .toggle button { padding: 2px 8px; border-radius: 6px; font-size: 11px; color: var(--text-dim); }
  .toggle button[aria-pressed='true'] { background: var(--bg); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / 8%); }

  /* ── split: rail + board ────────────────────────────────────────────── */
  main { flex: 1; display: flex; min-height: 0; }
  .rail {
    flex: none; width: 336px; min-height: 0; overflow: hidden;
    border-right: 1px solid var(--line); background: var(--bg);
    transition: width .18s ease, border-right-width .18s ease;
  }
  /* The rail animates shut; its inside keeps its width so nothing reflows on
     the way out. */
  .rail-inner { width: 336px; height: 100%; display: flex; flex-direction: column; min-height: 0; }
  body.rail-shut .rail { width: 0; border-right-width: 0; }
  .rail-list { flex: 1; overflow: auto; padding: 4px 0 24px; outline: none; }
  .section {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; background: var(--bg); border-bottom: 1px solid var(--line-soft);
    font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-faint);
  }
  .section .count { margin-left: auto; font-size: 11px; color: var(--text-faint); }
  .group { padding: 8px 10px 2px; font-size: 11px; color: var(--text-faint); }
  .row {
    display: flex; align-items: center; gap: 6px; width: 100%;
    padding: 3px 10px; text-align: left; line-height: 20px;
  }
  .row:hover { background: var(--hover); }
  .row[aria-selected='true'] { background: var(--accent-soft); }
  .row .name { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .dir { flex: 0 1 auto; overflow: hidden; color: var(--text-faint); font-size: 11px; }
  .row .grow { flex: 1; }
  .row.more { color: var(--text-dim); }
  .row.more .chev { flex: none; width: 10px; color: var(--text-faint); }
  .row .chip { flex: none; white-space: nowrap; }
  .row .meta { flex: 0 1 auto; min-width: 0; overflow: hidden; }
  .row .letter { flex: none; font-weight: 600; font-size: 11px; }
  .letter[data-k='M'], .letter[data-k='T'] { color: var(--dsw-alias-state-warn-label); }
  .letter[data-k='A'], .letter[data-k='U'] { color: var(--dsw-alias-state-success-primary); }
  .letter[data-k='R'], .letter[data-k='C'] { color: var(--dsw-alias-state-success-secondary); }
  .letter[data-k='D'] { color: var(--dsw-alias-state-error-primary); }
  .letter[data-k='!'] { color: var(--dsw-alias-state-error-secondary); }
  .letter[data-k='?'] { color: var(--dsw-alias-label-tertiary); }
  .row.file { padding-left: 26px; }
  .row.file .name { color: var(--text); }
  .node { flex: none; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--text-faint); }
  .node.current { background: var(--accent); box-shadow: 0 0 0 1.5px var(--accent-soft); }
  .node.merge { background: transparent; border: 1px solid var(--text-faint); }
  .subject { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.open .subject { font-weight: 600; }
  .meta { flex: 0 1 auto; margin-left: auto; color: var(--text-faint); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .beside { flex: none; padding: 0 4px; border-radius: 6px; color: var(--text-faint); opacity: 0; }
  .row:hover .beside, .row[aria-selected='true'] .beside { opacity: 1; }
  .beside:hover { color: var(--accent); background: var(--bg); }

  /* ── the diff board ─────────────────────────────────────────────────── */
  .board { flex: 1; display: flex; min-width: 0; min-height: 0; background: var(--surface); }
  .empty { margin: auto; max-width: 380px; padding: 24px; text-align: center; color: var(--text-dim); }
  .empty h2 { margin: 0 0 6px; font-size: 14px; color: var(--text); }
  .empty kbd, .status kbd {
    padding: 0 4px; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 4px; background: var(--bg); font: 11px var(--code-font);
  }
  .card {
    flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
    margin: 8px 0 8px 8px; background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  }
  .card:last-child { margin-right: 8px; }
  .card.focused { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card-head {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; background: var(--banner); border-bottom: 1px solid var(--line);
  }
  .card-head .path { font: 12px var(--code-font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-head .path .dir { color: var(--text-faint); }
  .card-head .revs { color: var(--text-dim); font: 11px var(--code-font); white-space: nowrap; }
  .card-head .stat { font: 11px var(--code-font); white-space: nowrap; }
  .card-head .stat .a { color: var(--dsw-alias-state-success-primary); }
  .card-head .stat .d { color: var(--dsw-alias-state-error-primary); }
  .card-head .actions { margin-left: auto; display: flex; gap: 2px; align-items: center; }
  .icon { padding: 2px 5px; border-radius: 6px; color: var(--text-dim); }
  .icon:hover { color: var(--text); background: var(--bg); }
  .icon[aria-pressed='true'] { color: var(--accent); }
  .card-body { flex: 1; min-height: 0; overflow: auto; }
  .card.collapsed .card-body { display: none; }
  .note { margin: 0; padding: 10px 12px; color: var(--text-dim); font-size: 12px; }

  /* One aligned row per line pair, drawn exactly as the plugin draws it. */
  .grid { font: var(--dsw-font-markdown-code-block); }
  .grid .line { display: grid; grid-template-columns: var(--gutter) minmax(0, 1fr) var(--gutter) minmax(0, 1fr); min-height: var(--row); }
  .grid[data-view='inline'] .line { grid-template-columns: var(--gutter) var(--gutter) minmax(0, 1fr); }
  .grid .num { text-align: right; padding-right: 12px; color: var(--text-faint); background: var(--surface); user-select: none; }
  .grid .text { padding: 0 12px 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .grid .held { grid-column: 1 / -1; background: var(--surface); color: var(--text-faint); padding-left: 12px; }
  .del { background: var(--del); }
  .add { background: var(--add); }
  .blank { background: var(--blank); }

  /* Unwrapped: one lane per half, each its own scroller, numbers pinned. */
  .lanes { display: flex; align-items: stretch; font: var(--dsw-font-markdown-code-block); }
  .lane { flex: 1 1 0; min-width: 0; overflow: auto hidden; }
  .lane-rows { display: grid; grid-template-columns: 1fr; grid-auto-rows: var(--row); align-content: start; width: max-content; min-width: 100%; }
  .lane-row { display: grid; grid-template-columns: var(--gutter) max-content; --band: var(--surface); }
  .lane-row[data-band='del'] { --band: var(--del); }
  .lane-row[data-band='add'] { --band: var(--add); }
  .lane-row[data-band='blank'] { --band: var(--blank); }
  .lane-row .b { background: var(--band); }
  .lane-num { position: sticky; left: 0; z-index: 1; background: var(--band); text-align: right; padding-right: 12px; color: var(--text-faint); user-select: none; }
  .lane-text { background: var(--band); padding: 0 14px 0 6px; white-space: pre; }
  .lane-held { background: var(--surface); }
  .lane-held > * { position: sticky; left: 0; color: var(--text-faint); padding-left: 12px; }

  /* ── status bar ─────────────────────────────────────────────────────── */
  .status {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 5px 12px; border-top: 1px solid var(--line); background: var(--banner);
    font-size: 11px; color: var(--text-dim);
  }
  .status .addr { font-family: var(--code-font); color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status .grow { flex: 1; }
  .tok-keyword { color: var(--shiki-token-keyword); }
  .tok-string { color: var(--shiki-token-string); }
  .tok-comment { color: var(--shiki-token-comment); font-style: italic; }
  .tok-number { color: var(--shiki-token-constant); }
  .tok-type { color: var(--shiki-token-function); }
</style>

<header class="top">

</footer>

  split: true,
  wrap: true,
  open: new Set([DATA.commits[0].short]),
  collapsed: new Set(),
  expandedGroups: new Set(),  // groups whose whole list the reader asked for
}

/* A list long enough to hide everything else below it is not a list any more.
   Past a handful of files a group shows its first few and says how many are
   behind them; the same rule serves the working tree's groups and one commit's
   files, so a reader learns it once. */
const PREVIEW = 8

const refName = (ref) => ref.replace(/^HEAD -> /, '').replace(/^refs\/heads\//, '').replace(/^refs\/remotes\//, '').replace(/^tag: refs\/tags\//, '')

/**
 * The chips a commit's row carries.
 *
 * A remote-tracking ref that is this branch on its remote — `origin/main` while
 * on `main` — is left out: the header already names the upstream, and next to
 * the branch it tracks it reads as a second branch rather than the same one
 * somewhere else.
 */
function rowRefs(commit) {
  const upstreamOfHead = `${DATA.repo.upstream ?? ''}`
  return commit.refs
    .filter((ref) => refName(ref) !== upstreamOfHead)
    .slice(0, 2)
}
const ageOf = (at) => {
  const minutes = Math.max(1, Math.round((Date.now() / 1000 - at) / 60))
  if (minutes < 60) return `${minutes} 分钟前`
  const hours = Math.round(minutes / 60)
  return hours < 24 ? `${hours} 小时前` : `${Math.round(hours / 24)} 天前`
}

const pathParts = (path) => {
  const at = path.lastIndexOf('/')
  return at < 0 ? ['', path] : [path.slice(0, at + 1), path.slice(at + 1)]
}
const changeAddress = (change) => `dsh-resource://git/diff?source=worktree&path=${change.path}`
const commitDiffAddress = (commit, file) => `dsh-resource://git/diff?source=commit&rev=${commit.short}&path=${file.path}`

/* ── the list ────────────────────────────────────────────────────────── */
const GROUPS = [['conflicted', '冲突'], ['staged', '已暂存'], ['unstaged', '未暂存'], ['untracked', '未跟踪']]

/** The files a group shows: all of them when asked, its first few otherwise. */
function shown(files, owner) {
  return state.expandedGroups.has(owner) ? files : files.slice(0, PREVIEW)
}

/** Every row the rail draws, in order; the cursor indexes this list. */
function railRows() {
  const rows = []
  if (state.filter !== 'commits') {
    for (const [stage, label] of GROUPS) {
      const items = DATA.changes.filter((c) => c.stage === stage)
      if (items.length === 0) continue
      rows.push({ kind: 'group', label, count: items.length })
      for (const change of shown(items, `stage:${stage}`)) {
        rows.push({ kind: 'change', key: changeAddress(change), change })
      }
      if (items.length > PREVIEW) rows.push({ kind: 'more', owner: `stage:${stage}`, hidden: items.length - PREVIEW })
    }
  }
  if (state.filter !== 'changes') {
    const commits = DATA.commits
    if (commits.length > 0) rows.push({ kind: 'section', label: '历史', count: commits.length })
    for (const commit of commits) {
      rows.push({ kind: 'commit', key: `commit:${commit.short}`, commit })
      if (!state.open.has(commit.short)) continue
      const files = commit.files
      for (const file of shown(files, commit.short)) {
        rows.push({ kind: 'file', key: commitDiffAddress(commit, file), commit, file })
      }
      if (files.length > PREVIEW) rows.push({ kind: 'more', owner: commit.short, hidden: files.length - PREVIEW })
    }
  }
  return rows
}

const letterOf = (status) => status

function describe(row) {
  if (row.kind === 'change') return `改动 · ${row.change.path}`
  if (row.kind === 'file') return `提交 ${row.commit.short} · ${row.file.path}`
  if (row.kind === 'more') return `还有 ${row.hidden} 个文件`
  return `提交 ${row.commit.short}`
}

function railMarkup() {
  return railRows().map((row, index) => {
    const selected = index === state.cursor ? ' aria-selected="true"' : ''
    if (row.kind === 'section') {
      return `<div class="section">${esc(row.label)}<span class="count">${row.count}</span></div>`
    }
    if (row.kind === 'group') {
      return `<div class="group">${esc(row.label)} ${row.count}</div>`
    }
    if (row.kind === 'more') {
      const open = state.expandedGroups.has(row.owner)
      return `<button class="row more" role="option"${selected} data-index="${index}" data-more="${esc(row.owner)}">
        <span class="chev">${open ? '▴' : '▾'}</span>
        <span class="name">${open ? '收起' : `还有 ${row.hidden} 个文件`}</span>
      </button>`
    }
    if (row.kind === 'change') {
      const [dir, base] = pathParts(row.change.path)
      return `<button class="row" role="option"${selected} data-index="${index}">
        <span class="name">${esc(base)}</span>${dir ? `<span class="dir">${esc(dir)}</span>` : ''}
        <span class="grow"></span><span class="letter" data-k="${letterOf(row.change.status)}">${esc(letterOf(row.change.status))}</span>
        <span class="beside" data-beside="${index}" title="并排打开">↗</span>
      </button>`
    }
    if (row.kind === 'commit') {
      const commit = row.commit
      const current = commit.refs.some((ref) => ref.includes('HEAD'))
      const merge = commit.parents > 1
      const count = commit.files.length > PREVIEW ? `<span class="chip">${commit.files.length} 个文件</span>` : ''
      return `<button class="row ${state.open.has(commit.short) ? 'open' : ''}" role="option"${selected} data-index="${index}">
        <span class="node ${current ? 'current' : ''} ${merge ? 'merge' : ''}"></span>
        <span class="subject">${esc(commit.subject)}</span>
        ${count}
        <span class="meta">${esc(commit.author)} · ${esc(ageOf(commit.at))}</span>
        ${rowRefs(commit).map((ref, at) => `<span class="chip ${at === 0 && current ? 'head' : ''}">${esc(refName(ref))}</span>`).join('')}
      </button>`
    }
    const [dir, base] = pathParts(row.file.path)
    return `<button class="row file" role="option"${selected} data-index="${index}">
      <span class="name">${esc(base)}</span>${dir ? `<span class="dir">${esc(dir)}</span>` : ''}
      <span class="grow"></span><span class="letter" data-k="${letterOf(row.file.status)}">${esc(letterOf(row.file.status))}</span>
      <span class="beside" data-beside="${index}" title="并排打开">↗</span>
    </button>`
  }).join('')
}

function renderRail() {
  $('list').innerHTML = railMarkup()
}

/* ── highlighting, small enough for a prototype ──────────────────────── */
/* One pass over the line: a later pass would match the markup an earlier one
   just inserted, which is how a highlighter ends up printing its own tags. */
const TOKEN = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|('[^']*'|"[^"]*")|\b(const|let|var|function|return|if|else|for|of|in|while|new|class|extends|import|from|export|default|type|interface|await|async|throw|try|catch|switch|case|break|continue|null|undefined|true|false|this|as|satisfies)\b|\b(string|number|boolean|void|unknown|never|readonly|ReactNode|Record|Map|Set|Array)\b|\b(\d+)\b/g

function highlight(text, lang) {
  if (lang === 'plain') return esc(text)
  if (lang === 'css') {
    let out = ''
    let last = 0
    for (const match of text.matchAll(/(\/\*[\s\S]*?\*\/)|(--[\w-]+)|(#[0-9a-fA-F]{3,8})/g)) {
      const cls = match[1] !== undefined ? 'tok-comment' : match[2] !== undefined ? 'tok-keyword' : 'tok-number'
      out += esc(text.slice(last, match.index)) + `<span class="${cls}">${esc(match[0])}</span>`
      last = match.index + match[0].length
    }
    return out + esc(text.slice(last))
  }
  let out = ''
  let last = 0
  for (const match of text.matchAll(TOKEN)) {
    const cls = match[1] !== undefined ? 'tok-comment' : match[2] !== undefined ? 'tok-string'
      : match[3] !== undefined ? 'tok-keyword' : match[4] !== undefined ? 'tok-type' : 'tok-number'
    out += esc(text.slice(last, match.index)) + `<span class="${cls}">${esc(match[0])}</span>`
    last = match.index + match[0].length
  }
  return out + esc(text.slice(last))
}

/* Only the two grammars the captured diffs need, plus a plain mode: writing is
   not code, and tokenizing it as TypeScript prints colours that mean nothing. */
const langOf = (path) => (path.endsWith('.css') ? 'css' : path.endsWith('.md') || path.endsWith('.json') ? 'plain' : 'ts')

/* ── the diff, drawn the way the plugin draws it ─────────────────────── */
function cells(row, view) {
  const [kind, lno, ltext, rno, rtext] = row
  if (kind === 'fold') return `<div class="held" style="grid-column:1/-1">⋯ ${lno} 行未改动</div>`
  const leftTone = lno === null ? 'blank' : kind === 'delete' || kind === 'replace' ? 'del' : ''
  const rightTone = rno === null ? 'blank' : kind === 'insert' || kind === 'replace' ? 'add' : ''
  return `<div class="line">
    <span class="num ${leftTone}">${lno === null ? '' : lno}</span>
    <span class="text ${leftTone}">${lno === null ? '' : highlight(ltext, view.lang)}</span>
    <span class="num ${rightTone}">${rno === null ? '' : rno}</span>
    <span class="text ${rightTone}">${rno === null ? '' : highlight(rtext, view.lang)}</span>
  </div>`
}

function inlineLine(no, other, tone, text, lang) {
  return `<div class="line"><span class="num ${tone}">${no === null ? '' : no}</span><span class="num ${tone}">${other === null ? '' : other}</span><span class="text ${tone}">${text === null ? '' : highlight(text, lang)}</span></div>`
}

function inlineCells(row, view) {
  const [kind, lno, ltext, rno, rtext] = row
  if (kind === 'fold') return `<div class="held" style="grid-column:1/-1">⋯ ${lno} 行未改动</div>`
  if (kind === 'context') return inlineLine(lno, rno, '', ltext, view.lang)
  if (kind === 'replace') return inlineLine(lno, null, 'del', ltext, view.lang) + inlineLine(null, rno, 'add', rtext, view.lang)
  if (kind === 'delete') return inlineLine(lno, null, 'del', ltext, view.lang)
  return inlineLine(null, rno, 'add', rtext, view.lang)
}

function laneMarkup(rows, view, side) {
  const band = (row) => {
    const [kind, lno, , rno] = row
    if (kind === 'fold') return ''
    const missing = side === 'left' ? lno === null : rno === null
    if (missing) return 'blank'
    if (kind === 'replace') return side === 'left' ? 'del' : 'add'
    if (kind === 'delete') return side === 'left' ? 'del' : ''
    if (kind === 'insert') return side === 'right' ? 'add' : ''
    return ''
  }
  return rows.map((row) => {
    const [kind, lno, ltext, rno, rtext] = row
    if (kind === 'fold') {
      return side === 'left'
        ? `<div class="lane-row lane-held" data-band=""><span class="b" style="grid-column:1">⋯ ${lno} 行未改动</span></div>`
        : '<div class="lane-row" data-band=""></div>'
    }
    const no = side === 'left' ? lno : rno
    const text = side === 'left' ? ltext : rtext
    return `<div class="lane-row" data-band="${band(row)}">
      <span class="b lane-num">${no === null ? '' : no}</span>
      <span class="b lane-text">${no === null ? '' : highlight(text, view.lang)}</span>
    </div>`
  }).join('')
}

function diffMarkup(diff, view) {
  const rows = diff.rows
  if (!view.split) {
    return `<div class="grid" data-view="inline">${rows.map((row) => inlineCells(row, view)).join('')}</div>`
  }
  if (view.wrap) {
    return `<div class="grid" data-view="split">${rows.map((row) => cells(row, view)).join('')}</div>`
  }
  return `<div class="lanes" data-view="split">
    <div class="lane"><div class="lane-rows">${laneMarkup(rows, view, 'left')}</div></div>
    <div class="lane"><div class="lane-rows">${laneMarkup(rows, view, 'right')}</div></div>
  </div>`
}

/* Only a few diffs are captured in this file. A file whose diff was not
   captured still opens something to look at — a sample for its file type,
   labelled as one in the card — because a prototype that answers a click with
   nothing teaches nothing about the interaction being prototyped. */
const SAMPLE = {
  ts: {
    head: ['import { readFile } from \'node:fs/promises\'', '', '/**', ' * Read one file, trimmed.', ' * @param path - the file to read.', ' * @returns its text, without a trailing newline.', ' */', 'export async function load(path: string): Promise<string> {', '  const text = await readFile(path, \'utf8\')'],
    before: ['  return text'],
    after: ['  const lines = text.split(\'\\n\')', '  return lines.join(\'\\n\')'],
    tail: ['}', ''],
  },
  css: {
    head: ['.panel {', '  display: flex;', '  flex-direction: column;', '  min-width: 0;'],
    before: ['  gap: 12px;'],
    after: ['  gap: 8px;', '  padding: 0 14px;'],
    tail: ['  border-radius: 12px;', '}'],
  },
  md: {
    head: ['# dsh-git', '', 'A DSH plugin that puts a repository\'s history in front of the harness:'],
    before: ['a read-only, syntax-highlighted, side-by-side diff in its own tab.'],
    after: ['a read-only, highlighted, side-by-side diff beside the list it came from.'],
    tail: ['', '## Install', ''],
  },
  other: {
    head: ['{', '  "name": "dsh-git",', '  "version": "0.0.1",'],
    before: ['  "private": true,'],
    after: ['  "private": false,'],
    tail: ['  "type": "module"', '}'],
  },
}

function sampleDiff(address) {
  const path = decodeURIComponent((address.match(/path=([^&]*)/) || [, ''])[1])
  const kind = path.endsWith('.tsx') || path.endsWith('.ts') ? 'ts'
    : path.endsWith('.css') ? 'css' : path.endsWith('.md') ? 'md' : 'other'
  const sample = SAMPLE[kind]
  const rows = []
  let no = 41
  for (const line of sample.head) rows.push(['context', (no += 1), line, no, line])
  const at = no + 1
  for (const line of sample.before) rows.push(['delete', (no += 1), line, null, null])
  for (const line of sample.after) rows.push(['insert', null, null, (no += 1), line])
  for (const line of sample.tail) rows.push(['context', (no += 1), line, no, line])
  rows.push(['fold', 128, '', null, ''])
  return { path, oldLabel: `${path.split('/').length > 1 ? 'HEAD' : 'index'}`, newLabel: 'working tree', added: sample.after.length, removed: sample.before.length, rows, sample: true }
}

function cardMarkup(address, index) {
  const captured = DATA.diffs[address]
  const diff = captured ?? sampleDiff(address)
  const focused = state.focused === address ? ' focused' : ''
  const collapsed = state.collapsed.has(address) ? ' collapsed' : ''
  const [dir, base] = pathParts(diff.path)
  return `<article class="card${focused}${collapsed}" data-address="${esc(address)}">
    <header class="card-head">
      <span class="path" title="${esc(address)}"><span class="dir">${esc(dir)}</span>${esc(base)}</span>
      <span class="revs" title="${esc(address)}">${esc(diff.oldLabel)} → ${esc(diff.newLabel)}</span>
      ${captured === undefined
        ? '<span class="chip" title="这个文件的 diff 没有收进原型，画的是该文件类型的示例">示例</span>'
        : `<span class="stat"><span class="a">+${diff.added}</span> <span class="d">−${diff.removed}</span></span>`}
      <span class="actions">
        <button class="icon" data-act="collapse" title="折叠 / 展开">▾</button>
        <button class="icon" data-act="close" title="关闭">✕</button>
      </span>
    </header>
    <div class="card-body">${diffMarkup(diff, { ...state, lang: langOf(diff.path) })}</div>
  </article>`
}

function renderBoard() {
  const board = $('board')
  if (state.cards.length === 0) {
    board.innerHTML = `<div class="empty">
      <h2>列表留在左边，diff 开在右边</h2>
      <p>点一条改动、或展开一个提交点它的文件。列表不会再被替换掉，所以没有"回来时还得恢复现场"这回事。</p>
      <p>行尾的 <strong>↗</strong>（或按住 <kbd>⌥</kbd> 回车）把 diff <strong>并排</strong>开在已有卡片旁边；同一条 diff 已经在板上时只聚焦，不会重复开。</p>
    </div>`
    return
  }
  board.innerHTML = state.cards.map(cardMarkup).join('')
}

function render() {
  document.body.classList.toggle('rail-shut', !state.railOpen)
  $('rail-toggle').textContent = state.railOpen ? '‹' : '›'
  $('rail-toggle').setAttribute('aria-pressed', String(state.railOpen))
  renderRail()
  renderBoard()
  const row = railRows()[state.cursor]
  $('status-text').textContent = row === undefined ? '没有可选的条目' : describe(row)
  const focused = state.focused
  $('status-addr').textContent = focused === null ? '' : focused
  document.querySelectorAll('#list .row').forEach((el) => {
    if (Number(el.dataset.index) === state.cursor) el.scrollIntoView({ block: 'nearest' })
  })
}

/* ── opening ─────────────────────────────────────────────────────────── */
function focusCard(address) {
  state.focused = address
  render()
}

/** Open one address: focus it when it is already on the board, else add it. */
function openAddress(address, beside) {
  if (state.cards.includes(address)) {
    if (beside) { /* already there; focusing is the honest answer */ }
    state.focused = address
  } else if (beside || state.cards.length === 0) {
    state.cards.push(address)
    state.focused = address
  } else {
    const at = state.cards.indexOf(state.focused)
    state.cards[at < 0 ? state.cards.length - 1 : at] = address
    state.focused = address
  }
  render()
}

function closeCard(address) {
  state.cards = state.cards.filter((card) => card !== address)
  state.collapsed.delete(address)
  if (state.focused === address) state.focused = state.cards[state.cards.length - 1] ?? null
  render()
}

function activate(index, beside) {
  const row = railRows()[index]
  if (row === undefined) return
  if (row.kind === 'commit') {
    if (state.open.has(row.commit.short)) state.open.delete(row.commit.short)
    else state.open.add(row.commit.short)
    render()
    return
  }
  if (row.kind === 'more') {
    if (state.expandedGroups.has(row.owner)) state.expandedGroups.delete(row.owner)
    else state.expandedGroups.add(row.owner)
    render()
    return
  }
  if (row.kind === 'group' || row.kind === 'section') return
  openAddress(row.key, beside)
}

/* ── wiring ──────────────────────────────────────────────────────────── */
$('list').addEventListener('click', (event) => {
  const beside = event.target.closest('[data-beside]')
  const row = event.target.closest('.row')
  if (row === null) return
  const index = Number(row.dataset.index)
  state.cursor = index
  activate(index, beside !== null)
})
$('list').addEventListener('mousemove', (event) => {
  const row = event.target.closest('.row')
  if (row === null) return
  const index = Number(row.dataset.index)
  if (index === state.cursor) return
  state.cursor = index
  renderRail()
})
$('board').addEventListener('click', (event) => {
  const card = event.target.closest('.card')
  if (card === null) return
  const address = card.dataset.address
  const act = event.target.closest('[data-act]')?.dataset.act
  if (act === 'close') return closeCard(address)
  if (act === 'collapse') {
    if (state.collapsed.has(address)) state.collapsed.delete(address)
    else state.collapsed.add(address)
    return render()
  }
  focusCard(address)
})

document.addEventListener('keydown', (event) => {
  if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
    event.preventDefault()
    const count = railRows().length
    state.cursor = Math.max(0, Math.min(count - 1, state.cursor + (event.key === 'ArrowDown' ? 1 : -1)))
    return render()
  }
  if (event.key === 'Enter') {
    event.preventDefault()
    return activate(state.cursor, event.altKey)
  }
  if (event.key === 'Escape') {
    if (state.focused !== null) return closeCard(state.focused)
  }
  if (event.key === 'b') { state.railOpen = !state.railOpen; return render() }
  if (event.key === 'w') return setWrap(!state.wrap)
  if (event.key === 'i') return setSplit(!state.split)
})

function setSplit(split) {
  state.split = split
  $('v-split').setAttribute('aria-pressed', String(split))
  $('v-inline').setAttribute('aria-pressed', String(!split))
  render()
}
function setWrap(wrap) {
  state.wrap = wrap
  $('w-wrap').setAttribute('aria-pressed', String(wrap))
  $('w-clip').setAttribute('aria-pressed', String(!wrap))
  render()
}
$('rail-toggle').onclick = () => { state.railOpen = !state.railOpen; render() }
$('v-split').onclick = () => setSplit(true)
$('v-inline').onclick = () => setSplit(false)
$('w-wrap').onclick = () => setWrap(true)
$('w-clip').onclick = () => setWrap(false)

$('repo').textContent = DATA.repo.name
$('branch').textContent = DATA.repo.branch
$('upstream').textContent = DATA.repo.upstream
setSplit(true)
setWrap(true)
render()
</script>
</body>
</html>
